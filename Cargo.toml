[package]
name = "ce-space"
version = "0.1.0"
edition = "2024"
description = "N-dimensional data comparison spaces over the CE mesh — Google Sheets for all kinds of data: link anything by ref, project it onto a shared representation plane via mesh converters, compare it with AI ops. The core backend of the space app group."
license = "AGPL-3.0-only"
repository = "https://github.com/ce-net/ce-space"

[lib]
name = "ce_space"
path = "src/lib.rs"

[[bin]]
name = "ce-space"
path = "src/main.rs"

[dependencies]
ce-rs = { git = "https://github.com/ce-net/ce-rs", features = ["serve", "locate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
